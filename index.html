<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <!-- Project CSS -->
    <link rel="stylesheet" href="./styles/index.css">
    <!-- Project JS -->
    <script src="./scripts/index.js" defer></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>
            <h1>
                To do List
            </h1>
        </header>
        <form id="form">
            <p>Adicione sua tarefa:</p>
            <div class="form-control">
                <div class="form-text">
                    <input type="text" id="input" placeholder="O que você vai fazer?" required>
                    <input type="text" id="description" placeholder="Adicione uma descrição!">
                </div>
                <button type="submit">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </form>
        <form id="edit-form" class="hide">
            <p>Edite a sua tarefa:</p>
            <div class="form-control">
                <div class="form-text">
                    <input type="text" id="edit-input">
                    <input type="text" id="edit-description">
                </div>
                <button type="submit">
                    <i class="fa-solid fa-check-double"></i>
                </button>
            </div>
            <button id="cancel-edit-btn">Cancelar</button>
        </form>
        <div id="toolbar">
            <div id="search">
                <h4>Pesquisar:</h4>
                <form id="form-search">
                    <input type="text" id="search-input" placeholder="Buscar">
                    <button id="erase-button">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </form>
            </div>
            <div id="filter">
                <h4>Filtrar:</h4>
                <select id="filter-select">
                    <option value="all">Todos</option>
                    <option value="done">Feitos</option>
                    <option value="pending">A fazer</option>
                </select>
            </div>
        </div>
        <div id="list">
            <div class="todo pending">
                <div class="text">
                    <h3>Ver email</h3>
                    <p>Procurar email PICME</p>
                </div>
                <div class="buttons">
                    <button class="finish">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <button class="edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="remove">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="todo done">
                <div class="text">
                    <h3>Ver email</h3>
                    <p>Procurar email PICME</p>
                </div>
                <div class="buttons">
                    <button class="finish">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <button class="edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="remove">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="no-results" class="hide">
            <h3>Sem resultados encontrados</h3>
        </div>
    </div>
</body>
</html>
